# Daily board refresh: re-fetch FantasyPros consensus + apply injury/handcuff adjustments.
# Update scripts/player-health.json before running (or include in the same PR).
name: Refresh player board

on:
  schedule:
    - cron: "0 14 * * *"  # 8:00 AM America/Denver (MDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run refresh-board

      - name: Open and auto-merge board refresh PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No ranking changes."
            exit 0
          fi
          DATE="$(date +%Y-%m-%d)"
          BR="data/refresh-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add scripts/ src/data/
          git commit -m "Refresh top-350 rankings and health adjustments (${DATE})"
          git push -u origin "$BR"

          gh label create board-refresh --description "Automated player board refresh" --color "0E8A16" --force >/dev/null

          BODY="$(cat <<EOF
          ## Summary
          - Re-fetched FantasyPros PPR + Half-PPR + Standard consensus rankings
          - Applied injury adjustments from \`scripts/player-health.json\`
          - Re-ranked handcuffs for injured starters
          - Updated What's updated banner changelog

          This PR is created by the daily board refresh workflow and auto-merges.

          _Auto-generated by refresh-board workflow._
          EOF
          )"

          URL="$(gh pr create --title "Daily board refresh ${DATE}" --label board-refresh --body "$BODY")"

          # Only auto-merge these daily board PRs. Close older data/refresh-* PRs so they do not stack.
          gh pr list --state open --json number,headRefName --jq \
            '.[] | select(.headRefName | test("^data/refresh-")) | select(.headRefName != "'"$BR"'") | .number' \
            | while read -r n; do
                [ -n "$n" ] || continue
                gh pr close "$n" --comment "Superseded by ${URL}"
              done

          # Repo has no required checks, so merge immediately. --auto is used when checks exist later.
          if ! gh pr merge --auto --squash --delete-branch; then
            gh pr merge --squash --delete-branch
          fi

          # Merges with GITHUB_TOKEN do not start other workflows; kick deploy so Pages updates.
          gh workflow run deploy.yml --ref master
