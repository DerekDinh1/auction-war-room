# Daily board refresh: re-fetch FantasyPros consensus + apply injury/handcuff adjustments.
# Update scripts/player-health.json before running (or include in the same PR).
name: Refresh player board

on:
  schedule:
    - cron: "0 14 * * *"  # 8:00 AM America/Denver (MDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run refresh-board

      - name: Create PR if board changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No ranking changes."
            exit 0
          fi
          BR="data/refresh-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add scripts/ src/AuctionWarRoom.jsx src/data/board-updates.json
          git commit -m "Refresh top-350 rankings and health adjustments ($(date +%Y-%m-%d))"
          git push -u origin "$BR"
          BODY="## Summary
          - Re-fetched FantasyPros PPR + Half-PPR + Standard consensus rankings
          - Applied injury adjustments from \`scripts/player-health.json\`
          - Re-ranked handcuffs for injured starters
          - Updated What's updated banner changelog

          ## Review
          - [ ] Verify injury statuses in \`scripts/player-health.json\` are current
          - [ ] Spot-check handcuff bumps (e.g. Mike Washington Jr. if Jeanty limited)
          - [ ] Confirm OUT/IR/OFS players marked gone on board

          _Auto-generated by refresh-board workflow._"
          gh pr create --title "Daily board refresh $(date +%Y-%m-%d)" --body "$BODY"
