# Daily board refresh: FantasyPros ranks + Sleeper health + handcuff adj.
# Manual nuance: edit scripts/player-health-overrides.json
name: Refresh player board

on:
  schedule:
    - cron: "0 14 * * *"  # 8:00 AM America/Denver (MDT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh board
        id: refresh
        run: |
          set +e
          npm run refresh-board
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "Sanity gate failed — will open PR instead of auto-commit."
            exit 0
          fi
          exit "$code"

      - name: Auto-commit data when gate passed
        if: steps.refresh.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/raw-db.json src/data/player-health.json scripts/top350-players.json scripts/top350-meta.json; then
            echo "No ranking/health changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/raw-db.json src/data/player-health.json scripts/top350-players.json scripts/top350-meta.json
          git commit -m "Refresh top-350 board and health ($(date +%Y-%m-%d))"
          git push origin HEAD:master

      - name: Open PR when sanity gate failed
        if: steps.refresh.outputs.exit_code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="data/refresh-failed-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          git commit -m "WIP: board refresh failed sanity gate ($(date +%Y-%m-%d))" || true
          git push -u origin "$BR" || true
          gh pr create --title "Board refresh needs review $(date +%Y-%m-%d)" --body "$(cat <<EOF
## Summary
Automated refresh hit the **sanity gate** (bad scrape or implausible churn). Review before merging.

## Checklist
- [ ] Inspect \`scripts/top350-meta.json\` / refresh logs
- [ ] Confirm FantasyPros HTML still parses
- [ ] Confirm Sleeper match rate

_Auto-generated by refresh-board workflow._
EOF
)" || true
